## Netdata go.d prometheus collector — scrape the pvs20r1-monitor exporter.
##
## TEMPLATE: this file contains __SOLAR_JOB__ / __SOLAR_HOST__ / __SOLAR_PORT__
## placeholders rendered by netdata/install.sh. Don't edit the tokens by hand;
## run `sudo ./install.sh` (optionally with --host/--port/--job).
##
## All pvs_* metrics are auto-discovered: one chart per metric, one dimension
## per label value (e.g. one per inverter serial). Metric names use full-unit
## suffixes (volts/amps/watts/celsius) so the auto-derived unit labels are
## human-readable, not single letters.
jobs:
  - name: __SOLAR_JOB__
    url: 'http://__SOLAR_HOST__:__SOLAR_PORT__/metrics'
    update_every: 10
