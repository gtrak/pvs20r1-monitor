## Netdata go.d prometheus collector — scrape the pvs20r1-monitor exporter.
##
## Drop into /etc/netdata/go.d/prometheus.conf and reload go.d
## (or `sudo netdatacli reload-health` / restart netdata).
##
## All pvs_* metrics are auto-discovered: one chart per metric, one
## dimension per label value (e.g. one per inverter serial). Metric names
## use full-unit suffixes (volts/amps/watts/celsius) so the auto-derived
## unit labels are human-readable, not single letters.
jobs:
  - name: solar_pi
    url: 'http://solar-pi:8080/metrics'
    update_every: 10
