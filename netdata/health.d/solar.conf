# Solar / PV alerting -- three alarms:
#   1. solar_fault          -- PVS gateway unreachable (exporter can't see it)
#   2. solar_not_generating -- daytime but an inverter isn't producing (30m sustained)
#   3. solar_no_data        -- no data from exporter (monitoring broken)
#
# Sources:
#   - go.d prometheus (job: solar_pi) -> raw pvs_* charts
#     chart CONTEXT = prometheus.solar_pi.pvs_<metric>
#     (e.g. prometheus.solar_pi.pvs_total_ac_power_watts)
#   - charts.d "solar" module (netdata/charts.d/solar.chart.sh) -> solar.not_generating
#     Combines a local sun-elevation daytime check (Annapolis, MD) with the
#     per-inverter DC voltage / AC power, because netdata health cannot
#     reference variables across different charts.
#     not_generating = 1 when daytime AND an inverter has AC==0 while
#     (DC > 300V [sun on panels, not converting] OR DC < 10V [off/dead]).

# 1. FAULT -- gateway unreachable
template: solar_fault
      on: prometheus.solar_pi.pvs_gateway_up
   lookup: max -1m unaligned of pvs_gateway_up
    units: up
   every: 10s
     crit: $this == 0
   delay: up 1m down 2m multiplier 1.5 max 1h
    class: Errors
     type: Solar
component: PV gateway
  summary: Solar gateway unreachable
     info: The exporter cannot reach the PVS gateway (pvs_gateway_up == 0).
       to: discord

# 2. NOT GENERATING -- daytime but an inverter is not producing when it should.
#    The charts.d module gates this on sun elevation (Annapolis coordinates)
#    and panel DC voltage, so it doesn't fire at night or at dim dawn.
#    delay up 30m: only raise after ~30 min sustained, so transient clouds /
#    dawn ramp-up don't fire it. Bump "up 30m" to tolerate longer dim periods.
template: solar_not_generating
      on: solar.not_generating
   lookup: max -1m unaligned of not_generating
    units: state
   every: 10s
     crit: $this == 1
   delay: up 30m down 5m multiplier 1.5 max 1h
    class: Errors
     type: Solar
component: PV system
  summary: Solar not generating during the day
     info: An inverter has had no AC output for ~30 min while it is daytime and the panels show enough sun (or are unexpectedly dead at DC~0V).
       to: discord

# 3. NO DATA -- exporter stopped sending data (monitoring broken)
template: solar_no_data
      on: prometheus.solar_pi.pvs_total_ac_power_watts
     calc: $now - $last_collected_t
    units: seconds
   every: 10s
     warn: $this > 120
     crit: $this > 300
   delay: up 0 down 5m multiplier 1.5 max 1h
    class: Latency
     type: Solar
component: PV exporter
  summary: Solar monitoring: no data
     info: No data received from the solar exporter for over 2 minutes (critical over 5 minutes).
       to: discord
