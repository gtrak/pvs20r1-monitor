# charts.d "solar" module configuration.
# All settings are optional; defaults are in solar.chart.sh.

# Site coordinates for the sun-elevation daytime check.
solar_lat=38.9784      # Annapolis, MD
solar_lon=-76.4921

# Collection interval (seconds).
solar_update_every=10

# DC voltage thresholds (volts) for the "not generating" logic.
#   solar_dc_threshold  -- DC above this means sun is on the panels (should produce)
#   solar_dc_dead       -- DC below this means the inverter is off/dead
solar_dc_threshold=300
solar_dc_dead=10
