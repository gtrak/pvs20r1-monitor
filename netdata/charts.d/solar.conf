# charts.d "solar" module configuration.
# TEMPLATE: __SOLAR_HOST__ / __SOLAR_PORT__ / __SOLAR_LAT__ / __SOLAR_LON__ are
# rendered by netdata/install.sh. Don't edit the tokens by hand; run install.sh.
#
# All settings are optional; the module (solar.chart.sh) has fallback defaults
# except solar_url, which must be set here (it is rendered from --host/--port).

# URL of the pvs20r1-monitor exporter's JSON endpoint.
solar_url=http://__SOLAR_HOST__:__SOLAR_PORT__/

# Site coordinates for the sun-elevation daytime check.
solar_lat=__SOLAR_LAT__
solar_lon=__SOLAR_LON__

# Collection interval (seconds).
solar_update_every=10

# DC voltage thresholds (volts) for the "not generating" logic.
#   solar_dc_threshold  -- DC above this means sun is on the panels (should produce)
#   solar_dc_dead       -- DC below this means the inverter is off/dead
solar_dc_threshold=300
solar_dc_dead=10
